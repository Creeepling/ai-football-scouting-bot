name: CI Code Quality & Compilation Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Code Validation & Compile Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python Bytecode Compilation
        run: |
          python -m py_compile \
            config.py \
            storage.py \
            telegram.py \
            database.py \
            metrics.py \
            charts.py \
            agent.py \
            main.py \
            generate_interview_case_study.py

      - name: Verify PDF Case Study Generator
        run: |
          python generate_interview_case_study.py
